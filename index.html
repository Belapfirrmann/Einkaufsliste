<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marktliste</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Marktliste">
<meta name="theme-color" content="#F1F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121815" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F1F3EE; --surface:#FFFFFF; --surface-2:#E7EBE3; --sunk:#EDF0E9;
  --ink:#16201B; --ink-2:#4C594F; --ink-3:#7A867C;
  --line:#D7DCD2; --line-2:#C3CABC;
  --accent:#1F6B4A; --accent-ink:#FFFFFF; --accent-soft:#DEEBE2;
  --danger:#A33A22;
  --r:14px; --r-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121815; --surface:#1A211C; --surface-2:#232B25; --sunk:#161D19;
    --ink:#ECF0E9; --ink-2:#A8B3A9; --ink-3:#7E897F;
    --line:#2C352E; --line-2:#3A453C;
    --accent:#5BC08D; --accent-ink:#0E1712; --accent-soft:#1D3328;
    --danger:#E07B60;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121815; --surface:#1A211C; --surface-2:#232B25; --sunk:#161D19;
  --ink:#ECF0E9; --ink-2:#A8B3A9; --ink-3:#7E897F;
  --line:#2C352E; --line-2:#3A453C;
  --accent:#5BC08D; --accent-ink:#0E1712; --accent-soft:#1D3328;
  --danger:#E07B60;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
}
.wrap{max-width:780px;margin:0 auto;padding-left:16px;padding-right:16px;padding-block:22px 72px}
h1,h2,h3{font-family:"Bricolage Grotesque","Schibsted Grotesk",sans-serif;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:1.4rem;font-weight:700;line-height:1.1}
h2{font-size:1.02rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
.top{display:flex;flex-direction:column;gap:16px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px}
.brand svg{flex:none;display:block}
.sub{font-size:.82rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--ink-2);padding:8px 6px;border-radius:8px;font-weight:600;font-size:.88rem;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2);font-size:.88rem}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 13px;font-weight:600;font-size:.88rem;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2);padding:6px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.small{padding:5px 9px;font-size:.78rem;border-radius:8px}
input[type=text],input[type=search],select,textarea{
  background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;width:100%;min-width:0;
}
input::placeholder{color:var(--ink-3)}

/* add bar */
.add{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.add .name{flex:1 1 170px}
.add .qty{flex:0 1 92px}
.add .mk{flex:0 1 148px}
.add .btn{flex:0 0 auto}
.remember{display:flex;align-items:center;gap:7px;flex-basis:100%;font-size:.8rem;color:var(--ink-2)}
.remember input{accent-color:var(--accent);width:15px;height:15px}

/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:500}
.chip[aria-pressed="true"] .n{color:var(--paper);opacity:.7}
.chip.over,.group.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* groups */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group-head{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line)}
.group-head .count{margin-left:auto;font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dot{width:11px;height:11px;border-radius:3px;flex:none;background:var(--ink-3)}
.strip{height:3px;background:var(--ink-3)}
ul.items{list-style:none;margin:0;padding:0}
li.item{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;border-top:1px solid var(--line)}
li.item:first-child{border-top:0}
li.item.dragging{opacity:.4}
.grip{cursor:grab;color:var(--ink-3);flex:none;display:none}
@media (hover:hover) and (pointer:fine){.grip{display:block}}
.tick{flex:none;width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.tick svg{opacity:0}
.tick[aria-pressed="true"] svg{opacity:1;color:var(--accent-ink)}
.itemname{flex:1 1 130px;min-width:0;overflow-wrap:anywhere;font-weight:500}
.qty{font-size:.78rem;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.done .itemname{text-decoration:line-through;color:var(--ink-3);font-weight:400}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto}
select.pick{width:auto;max-width:150px;padding:5px 7px;font-size:.8rem;border-radius:8px;background:var(--sunk);border-color:var(--line)}
.x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:4px 6px;border-radius:7px;font-size:1rem;line-height:1}
.x:hover{color:var(--danger);background:var(--surface-2)}
.empty{padding:22px 14px;text-align:center;color:var(--ink-2);font-size:.9rem}

/* catalog */
.searchrow{display:flex;gap:8px;align-items:center}
.cat-group{padding:12px 14px;border-top:1px solid var(--line)}
.cat-group:first-child{border-top:0}
.cat-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 6px 5px 12px;font-size:.86rem}
.pill.on{background:var(--accent-soft);border-color:var(--accent)}
.pill .plus{border:0;background:var(--surface-2);color:var(--ink);width:23px;height:23px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:.95rem;line-height:1;padding:0}
.pill.on .plus{background:var(--accent);color:var(--accent-ink)}
.pill .drop{border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:0 4px;font-size:.85rem}

/* markets */
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:12px 14px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow input[type=text]{flex:1 1 140px;width:auto;border-color:transparent;background:transparent;padding:5px 7px;font-weight:600}
.mrow input[type=text]:hover{border-color:var(--line-2)}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:19px;height:19px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.backup textarea{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.76rem;min-height:96px;background:var(--sunk)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
footer{margin-top:26px;color:var(--ink-3);font-size:.76rem;text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){
  .group,.pill,.chip{transition:border-color .15s ease,box-shadow .15s ease,background-color .15s ease}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="var(--ink)"/>
        <circle cx="9" cy="9.5" r="2.6" fill="#E4572E"/>
        <rect x="14.5" y="8" width="11" height="3" rx="1.5" fill="var(--paper)" opacity=".92"/>
        <circle cx="9" cy="16" r="2.6" fill="#C9A227"/>
        <rect x="14.5" y="14.5" width="11" height="3" rx="1.5" fill="var(--paper)" opacity=".72"/>
        <circle cx="9" cy="22.5" r="2.6" fill="#5BC08D"/>
        <rect x="14.5" y="21" width="8" height="3" rx="1.5" fill="var(--paper)" opacity=".52"/>
      </svg>
      <div>
        <h1>Marktliste</h1>
        <p class="sub" id="subline">Wird geladen …</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Ansicht">
      <button role="tab" id="tab-liste" data-tab="liste" aria-selected="true">Einkaufsliste</button>
      <button role="tab" id="tab-sammel" data-tab="sammel" aria-selected="false">Sammelliste</button>
      <button role="tab" id="tab-maerkte" data-tab="maerkte" aria-selected="false">Märkte</button>
    </nav>
  </header>

  <!-- Einkaufsliste -->
  <section id="panel-liste" class="stack" role="tabpanel" aria-labelledby="tab-liste">
    <form class="add" id="add-form" autocomplete="off">
      <input class="name" id="add-name" type="text" placeholder="Was brauchst du?" aria-label="Produkt" required>
      <input class="qty" id="add-qty" type="text" placeholder="Menge" aria-label="Menge">
      <select class="mk" id="add-market" aria-label="Markt"></select>
      <button class="btn primary" type="submit">Hinzufügen</button>
      <label class="remember"><input type="checkbox" id="add-remember" checked> Produkt in Sammelliste merken</label>
    </form>
    <div class="chips" id="chips"></div>
    <div class="stack" id="groups"></div>
    <div class="row-btns" id="liste-actions"></div>
  </section>

  <!-- Sammelliste -->
  <section id="panel-sammel" class="stack" role="tabpanel" aria-labelledby="tab-sammel" hidden>
    <form class="add" id="cat-form" autocomplete="off">
      <input class="name" id="cat-name" type="text" placeholder="Neues Produkt merken" aria-label="Produkt" required>
      <select class="mk" id="cat-market" aria-label="Markt"></select>
      <button class="btn primary" type="submit">Merken</button>
    </form>
    <div class="searchrow">
      <input type="search" id="cat-search" placeholder="Sammelliste durchsuchen" aria-label="Sammelliste durchsuchen">
    </div>
    <div class="card" id="catalog"></div>
    <p class="muted">Tipp: Auf <strong>+</strong> tippen setzt das Produkt mit seinem Markt auf die Einkaufsliste.</p>
  </section>

  <!-- Märkte -->
  <section id="panel-maerkte" class="stack" role="tabpanel" aria-labelledby="tab-maerkte" hidden>
    <form class="add" id="market-form" autocomplete="off">
      <input class="name" id="market-name" type="text" placeholder="Neuer Markt, z. B. Edeka" aria-label="Marktname" required>
      <button class="btn primary" type="submit">Markt anlegen</button>
    </form>
    <div class="card" id="markets"></div>
    <div class="card backup stack" style="padding:14px;gap:10px">
      <div>
        <p class="label">Datensicherung</p>
        <p class="muted">Alles liegt nur in diesem Browser. Zum Umziehen den Text kopieren und auf dem anderen Gerät einfügen.</p>
      </div>
      <textarea id="backup" spellcheck="false" aria-label="Daten als Text"></textarea>
      <div class="row-btns">
        <button class="btn" type="button" data-act="export">Daten anzeigen</button>
        <button class="btn" type="button" data-act="import">Aus Text laden</button>
        <button class="btn ghost" type="button" data-act="reset" style="margin-left:auto;color:var(--danger)">Alles zurücksetzen</button>
      </div>
      <p class="muted" id="backup-msg" hidden></p>
    </div>
  </section>

  <footer>Marktliste · offline im Browser gespeichert</footer>
</div>
<script>
(function(){
"use strict";
var KEY = "marktliste.v1";
var COLORS = ["#2E86AB","#E4572E","#6A4C93","#3F8F5F","#C9A227","#B5446E","#2F7D7A","#8A6A4B"];

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

function seed(){
  var m = [
    {id:"m1", name:"Rewe",    color:COLORS[0]},
    {id:"m2", name:"Aldi",    color:COLORS[1]},
    {id:"m3", name:"dm",      color:COLORS[2]},
    {id:"m4", name:"Bauhaus", color:COLORS[4]}
  ];
  var cat = [
    ["Milch","m1"],["Butter","m1"],["Eier","m1"],["Vollkornbrot","m1"],["Käse","m1"],
    ["Kaffeebohnen","m1"],["Olivenöl","m1"],["Nudeln","m2"],["Haferflocken","m2"],
    ["Tomaten","m2"],["Bananen","m2"],["Spülmaschinentabs","m2"],
    ["Zahnpasta","m3"],["Duschgel","m3"],["Waschmittel","m3"],["Taschentücher","m3"],
    ["Gaffer-Tape","m4"],["Kabelbinder","m4"],["Batterien AA","m4"],["Klebeband","m4"]
  ].map(function(p){ return {id:uid(), name:p[0], marketId:p[1]}; });
  function byName(n){ var f = cat.filter(function(c){return c.name===n;})[0]; return f?f.marketId:null; }
  var items = [
    {name:"Milch",         qty:"2 l",      m:byName("Milch"),         done:false},
    {name:"Kaffeebohnen",  qty:"",         m:byName("Kaffeebohnen"),  done:false},
    {name:"Käse",          qty:"",         m:byName("Käse"),          done:true},
    {name:"Bananen",       qty:"1 Hand",   m:byName("Bananen"),       done:false},
    {name:"Spülmaschinentabs", qty:"",     m:byName("Spülmaschinentabs"), done:false},
    {name:"Zahnpasta",     qty:"2",        m:byName("Zahnpasta"),     done:false},
    {name:"Gaffer-Tape",   qty:"3 Rollen", m:byName("Gaffer-Tape"),   done:false},
    {name:"Kabelbinder",   qty:"",         m:null,                    done:false}
  ].map(function(i){ return {id:uid(), name:i.name, qty:i.qty, marketId:i.m, done:i.done}; });
  return {markets:m, catalog:cat, items:items, sample:true};
}

var db;
try { var raw = localStorage.getItem(KEY); db = raw ? JSON.parse(raw) : seed(); }
catch(e){ db = seed(); }
if(!db || !Array.isArray(db.markets)) db = seed();
db.markets = db.markets || []; db.catalog = db.catalog || []; db.items = db.items || [];

var ui = {tab:"liste", filter:"all", search:""};

function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }
function market(id){ return db.markets.filter(function(m){return m.id===id;})[0] || null; }
function marketName(id){ var m = market(id); return m ? m.name : "Ohne Markt"; }
function marketColor(id){ var m = market(id); return m ? m.color : "var(--ink-3)"; }
function $(s){ return document.querySelector(s); }

function marketOptions(sel, opts){
  var html = '<option value="">' + (opts && opts.nullLabel ? opts.nullLabel : "Ohne Markt") + '</option>';
  db.markets.forEach(function(m){
    html += '<option value="' + m.id + '"' + (m.id===sel ? " selected" : "") + '>' + esc(m.name) + '</option>';
  });
  return html;
}

/* ---------- Einkaufsliste ---------- */
function groupsFor(){
  var out = [];
  var loose = db.items.filter(function(i){ return !market(i.marketId); });
  if(loose.length) out.push({id:"", name:"Noch keinem Markt zugeordnet", color:"var(--ink-3)", items:loose});
  db.markets.forEach(function(m){
    out.push({id:m.id, name:m.name, color:m.color, items:db.items.filter(function(i){ return i.marketId===m.id; })});
  });
  return out;
}

function renderChips(){
  var groups = groupsFor();
  var open = db.items.filter(function(i){ return !i.done; }).length;
  var html = '<button type="button" class="chip" data-drop="" data-act="filter" data-id="all" aria-pressed="' +
             (ui.filter==="all") + '">Alle <span class="n">' + open + '</span></button>';
  groups.forEach(function(g){
    var o = g.items.filter(function(i){ return !i.done; }).length;
    html += '<button type="button" class="chip" data-drop="' + g.id + '" data-act="filter" data-id="' + (g.id||"none") +
            '" aria-pressed="' + (ui.filter===(g.id||"none")) + '">' +
            '<span class="dot" style="background:' + g.color + '"></span>' + esc(g.id ? g.name : "Ohne Markt") +
            ' <span class="n">' + o + '</span></button>';
  });
  $("#chips").innerHTML = html;
}

function itemRow(it){
  return '<li class="item' + (it.done ? " done" : "") + '" draggable="true" data-id="' + it.id + '">' +
    '<span class="grip" aria-hidden="true">⠿</span>' +
    '<button type="button" class="tick" data-act="toggle" data-id="' + it.id + '" aria-pressed="' + it.done +
      '" aria-label="' + esc(it.name) + ' abhaken">' +
      '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
    '</button>' +
    '<span class="itemname">' + esc(it.name) + '</span>' +
    (it.qty ? '<span class="qty">' + esc(it.qty) + '</span>' : "") +
    '<span class="tools">' +
      '<select class="pick" data-act="move" data-id="' + it.id + '" aria-label="Markt für ' + esc(it.name) + '">' +
        marketOptions(it.marketId) + '</select>' +
      '<button type="button" class="x" data-act="del-item" data-id="' + it.id + '" aria-label="' + esc(it.name) + ' entfernen">✕</button>' +
    '</span></li>';
}

function renderGroups(){
  var groups = groupsFor().filter(function(g){
    if(ui.filter === "all") return g.items.length > 0;
    return (g.id || "none") === ui.filter;
  });
  var host = $("#groups");
  if(!db.items.length){
    host.innerHTML = '<div class="card"><p class="empty">Die Liste ist leer. Produkte oben eintragen oder in der Sammelliste auf + tippen.</p></div>';
  } else if(!groups.length){
    host.innerHTML = '<div class="card"><p class="empty">Für diesen Markt steht nichts an.</p></div>';
  } else {
    host.innerHTML = groups.map(function(g){
      var done = g.items.filter(function(i){ return i.done; }).length;
      var sorted = g.items.slice().sort(function(a,b){ return (a.done?1:0) - (b.done?1:0); });
      return '<section class="group" data-drop="' + g.id + '">' +
        '<div class="strip" style="background:' + g.color + '"></div>' +
        '<div class="group-head"><span class="dot" style="background:' + g.color + '"></span>' +
          '<h2>' + esc(g.name) + '</h2>' +
          '<span class="count">' + done + '/' + g.items.length + '</span>' +
          (done ? '<button type="button" class="btn ghost small" data-act="clear-done" data-id="' + (g.id||"none") + '">Erledigte weg</button>' : "") +
        '</div>' +
        (sorted.length ? '<ul class="items">' + sorted.map(itemRow).join("") + '</ul>'
                       : '<p class="empty">Noch nichts für ' + esc(g.name) + '.</p>') +
      '</section>';
    }).join("");
  }
  var anyDone = db.items.some(function(i){ return i.done; });
  $("#liste-actions").innerHTML = anyDone
    ? '<button type="button" class="btn" data-act="clear-done" data-id="all">Alle erledigten entfernen</button>' : "";
}

/* ---------- Sammelliste ---------- */
function onList(name){
  return db.items.some(function(i){ return i.name.toLowerCase() === name.toLowerCase() && !i.done; });
}

function renderCatalog(){
  var q = ui.search.trim().toLowerCase();
  var pool = db.catalog.filter(function(c){ return !q || c.name.toLowerCase().indexOf(q) >= 0; });
  var buckets = [];
  var loose = pool.filter(function(c){ return !market(c.marketId); });
  db.markets.forEach(function(m){
    var list = pool.filter(function(c){ return c.marketId === m.id; });
    if(list.length) buckets.push({name:m.name, color:m.color, list:list});
  });
  if(loose.length) buckets.push({name:"Ohne Markt", color:"var(--ink-3)", list:loose});

  var host = $("#catalog");
  if(!buckets.length){
    host.innerHTML = '<p class="empty">' + (q ? 'Nichts gefunden für „' + esc(ui.search) + '“.' : "Die Sammelliste ist leer. Oben ein Produkt merken.") + '</p>';
    return;
  }
  host.innerHTML = buckets.map(function(b){
    return '<div class="cat-group">' +
      '<div class="cat-head"><span class="dot" style="background:' + b.color + '"></span><h2>' + esc(b.name) + '</h2>' +
        '<span class="count muted" style="margin-left:auto;font-size:.78rem">' + b.list.length + '</span></div>' +
      '<div class="pills">' + b.list.slice().sort(function(a,c){ return a.name.localeCompare(c.name,"de"); }).map(function(c){
        var on = onList(c.name);
        return '<span class="pill' + (on ? " on" : "") + '">' +
          esc(c.name) +
          '<select class="pick" data-act="cat-move" data-id="' + c.id + '" aria-label="Markt für ' + esc(c.name) + '">' +
            marketOptions(c.marketId) + '</select>' +
          '<button type="button" class="plus" data-act="cat-add" data-id="' + c.id + '" aria-label="' + esc(c.name) +
            ' auf die Einkaufsliste">' + (on ? "✓" : "+") + '</button>' +
          '<button type="button" class="drop" data-act="cat-del" data-id="' + c.id + '" aria-label="' + esc(c.name) +
            ' aus der Sammelliste löschen">✕</button>' +
        '</span>';
      }).join("") + '</div></div>';
  }).join("");
}

/* ---------- Märkte ---------- */
function renderMarkets(){
  var host = $("#markets");
  if(!db.markets.length){
    host.innerHTML = '<p class="empty">Noch keine Märkte. Oben einen anlegen.</p>';
    return;
  }
  host.innerHTML = db.markets.map(function(m){
    var n = db.items.filter(function(i){ return i.marketId === m.id; }).length;
    return '<div class="mrow">' +
      '<span class="dot" style="background:' + m.color + '"></span>' +
      '<input type="text" value="' + esc(m.name) + '" data-act="rename" data-id="' + m.id + '" aria-label="Name des Markts">' +
      '<span class="swatches">' + COLORS.map(function(c){
        return '<button type="button" class="sw" style="background:' + c + '" data-act="color" data-id="' + m.id +
               '" data-color="' + c + '" aria-pressed="' + (c===m.color) + '" aria-label="Farbe ' + c + '"></button>';
      }).join("") + '</span>' +
      '<span class="muted" style="font-size:.78rem">' + n + ' auf der Liste</span>' +
      '<button type="button" class="x" data-act="del-market" data-id="' + m.id + '" aria-label="' + esc(m.name) + ' löschen">✕</button>' +
    '</div>';
  }).join("");
}

/* ---------- Rahmen ---------- */
function renderHead(){
  var open = db.items.filter(function(i){ return !i.done; }).length;
  var done = db.items.length - open;
  var parts = [open + (open === 1 ? " Produkt offen" : " Produkte offen")];
  if(done) parts.push(done + " erledigt");
  parts.push(db.markets.length + (db.markets.length === 1 ? " Markt" : " Märkte"));
  $("#subline").textContent = parts.join(" · ");
  $("#add-market").innerHTML = marketOptions($("#add-market").value || "", {nullLabel:"Markt wählen"});
  $("#cat-market").innerHTML = marketOptions($("#cat-market").value || "", {nullLabel:"Markt wählen"});
}

function render(){
  renderHead();
  if(ui.tab === "liste"){ renderChips(); renderGroups(); }
  if(ui.tab === "sammel"){ renderCatalog(); }
  if(ui.tab === "maerkte"){ renderMarkets(); }
}

function setTab(name){
  ui.tab = name;
  ["liste","sammel","maerkte"].forEach(function(t){
    $("#panel-" + t).hidden = (t !== name);
    $("#tab-" + (t === "maerkte" ? "maerkte" : t)).setAttribute("aria-selected", String(t === name));
  });
  render();
}

function addItem(name, qty, marketId, remember){
  name = name.trim();
  if(!name) return;
  db.items.push({id:uid(), name:name, qty:(qty||"").trim(), marketId:marketId || null, done:false});
  if(remember && !db.catalog.some(function(c){ return c.name.toLowerCase() === name.toLowerCase(); })){
    db.catalog.push({id:uid(), name:name, marketId:marketId || null});
  }
  save();
}

/* Events */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(!t) return;
  var act = t.dataset.act, id = t.dataset.id;

  if(t.dataset.tab) return;

  if(act === "filter"){ ui.filter = id; render(); }
  else if(act === "toggle"){
    db.items.forEach(function(i){ if(i.id === id) i.done = !i.done; });
    save(); render();
  }
  else if(act === "del-item"){
    db.items = db.items.filter(function(i){ return i.id !== id; });
    save(); render();
  }
  else if(act === "clear-done"){
    db.items = db.items.filter(function(i){
      if(!i.done) return true;
      if(id === "all") return false;
      var key = market(i.marketId) ? i.marketId : "none";
      return key !== id;
    });
    save(); render();
  }
  else if(act === "cat-add"){
    var c = db.catalog.filter(function(x){ return x.id === id; })[0];
    if(!c) return;
    if(onList(c.name)){
      db.items = db.items.filter(function(i){ return !(i.name.toLowerCase() === c.name.toLowerCase() && !i.done); });
    } else {
      db.items.push({id:uid(), name:c.name, qty:"", marketId:c.marketId || null, done:false});
    }
    save(); renderHead(); renderCatalog();
  }
  else if(act === "cat-del"){
    db.catalog = db.catalog.filter(function(x){ return x.id !== id; });
    save(); renderCatalog();
  }
  else if(act === "color"){
    db.markets.forEach(function(m){ if(m.id === id) m.color = t.dataset.color; });
    save(); renderMarkets();
  }
  else if(act === "del-market"){
    var m = market(id);
    if(!m) return;
    var n = db.items.filter(function(i){ return i.marketId === id; }).length;
    if(!confirm('„' + m.name + '“ löschen?' + (n ? " " + n + " Produkt(e) landen wieder bei „Ohne Markt“." : ""))) return;
    db.markets = db.markets.filter(function(x){ return x.id !== id; });
    db.items.forEach(function(i){ if(i.marketId === id) i.marketId = null; });
    db.catalog.forEach(function(c){ if(c.marketId === id) c.marketId = null; });
    if(ui.filter === id) ui.filter = "all";
    save(); render();
  }
  else if(act === "export"){
    $("#backup").value = JSON.stringify({markets:db.markets, catalog:db.catalog, items:db.items});
    msg("Text markieren und kopieren.");
  }
  else if(act === "import"){
    try {
      var d = JSON.parse($("#backup").value);
      if(!d.markets || !d.items) throw new Error("unvollständig");
      db = {markets:d.markets, catalog:d.catalog || [], items:d.items};
      save(); render(); msg("Daten übernommen.");
    } catch(err){ msg("Der Text ist keine gültige Sicherung. Bitte die komplette Zeile einfügen."); }
  }
  else if(act === "reset"){
    if(!confirm("Alle Listen, Produkte und Märkte löschen?")) return;
    db = {markets:[], catalog:[], items:[]};
    ui.filter = "all"; save(); render(); msg("Alles geleert.");
  }
});

function msg(text){
  var el = $("#backup-msg");
  el.textContent = text; el.hidden = false;
}

document.querySelector(".tabs").addEventListener("click", function(e){
  var b = e.target.closest("[data-tab]");
  if(b) setTab(b.dataset.tab);
});

document.addEventListener("change", function(e){
  var t = e.target.closest("[data-act]");
  if(!t) return;
  var act = t.dataset.act, id = t.dataset.id;
  if(act === "move"){
    db.items.forEach(function(i){ if(i.id === id) i.marketId = t.value || null; });
    save(); render();
  } else if(act === "cat-move"){
    db.catalog.forEach(function(c){ if(c.id === id) c.marketId = t.value || null; });
    save(); renderCatalog();
  } else if(act === "rename"){
    var name = t.value.trim();
    if(!name){ renderMarkets(); return; }
    db.markets.forEach(function(m){ if(m.id === id) m.name = name; });
    save(); render();
  }
});

$("#add-form").addEventListener("submit", function(e){
  e.preventDefault();
  addItem($("#add-name").value, $("#add-qty").value, $("#add-market").value, $("#add-remember").checked);
  $("#add-name").value = ""; $("#add-qty").value = "";
  render(); $("#add-name").focus();
});

$("#cat-form").addEventListener("submit", function(e){
  e.preventDefault();
  var name = $("#cat-name").value.trim();
  if(!name) return;
  if(!db.catalog.some(function(c){ return c.name.toLowerCase() === name.toLowerCase(); })){
    db.catalog.push({id:uid(), name:name, marketId:$("#cat-market").value || null});
    save();
  }
  $("#cat-name").value = "";
  renderCatalog(); $("#cat-name").focus();
});

$("#market-form").addEventListener("submit", function(e){
  e.preventDefault();
  var name = $("#market-name").value.trim();
  if(!name) return;
  db.markets.push({id:uid(), name:name, color:COLORS[db.markets.length % COLORS.length]});
  $("#market-name").value = "";
  save(); render();
});

$("#cat-search").addEventListener("input", function(e){
  ui.search = e.target.value;
  renderCatalog();
});

/* Drag & Drop */
var dragId = null, zone = null;
document.addEventListener("dragstart", function(e){
  var row = e.target.closest(".item");
  if(!row) return;
  dragId = row.dataset.id;
  row.classList.add("dragging");
  try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch(err){}
});
document.addEventListener("dragend", function(){
  dragId = null;
  document.querySelectorAll(".dragging").forEach(function(n){ n.classList.remove("dragging"); });
  if(zone){ zone.classList.remove("over"); zone = null; }
});
document.addEventListener("dragover", function(e){
  if(!dragId) return;
  var z = e.target.closest("[data-drop]");
  if(!z) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  if(zone !== z){ if(zone) zone.classList.remove("over"); zone = z; z.classList.add("over"); }
});
document.addEventListener("drop", function(e){
  var z = e.target.closest("[data-drop]");
  if(!z || !dragId) return;
  e.preventDefault();
  var target = z.dataset.drop || null;
  if(z.dataset.id === "all"){ dragId = null; z.classList.remove("over"); return; }
  db.items.forEach(function(i){ if(i.id === dragId) i.marketId = target; });
  dragId = null; zone = null;
  save(); render();
});

setTab("liste");
})();
</script>
</body>
</html>
